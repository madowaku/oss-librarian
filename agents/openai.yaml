interface:
  display_name: "OSS Librarian"
  short_description: "Find reusable OSS and game-source precedents before coding"
  default_prompt: "Use $oss-librarian to research reusable OSS before implementation. If this is a game mechanic or game-system task, activate game-source mode and inspect complete-game precedents with separate code/content license checks."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server for repository and code search"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"

policy:
  allow_implicit_invocation: true
